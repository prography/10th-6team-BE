name: CI/CD Deploy To EC2

on:
  pull_request:
    branches: [ dev ]
  push:
    branches:
      - dev
      - release/prod

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application.yml from template
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application.yml
          ${{ secrets.APPLICATION_PROPERTIES }}
          EOF

      - name: Set up Java 17 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/release/prod' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker image
        if: github.ref == 'refs/heads/release/prod' && github.event_name == 'push'
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/zone2be-app:release-prod"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

  deploy-production:
    if: github.ref == 'refs/heads/release/prod' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            IMAGE=${{ secrets.DOCKER_USERNAME }}/zone2be-app:release-prod

            # 기존 컨테이너 중지 및 삭제
            docker stop zone2be-app || true
            docker rm zone2be-app || true

            # 새 이미지 Pull
            docker pull $IMAGE

            # 환경변수를 런타임에 주입하여 실행
            docker run -d \
              --name zone2be-app \
              --network zone2be_network \
              -p 8080:8080 \
              -e TZ=Asia/Seoul \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
              -e REDIS_USER="${{ secrets.REDIS_USER }}" \
              -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e APPLE_CLIENT_ID="${{ secrets.APPLE_CLIENT_ID }}" \
              -e APPLE_CLIENT_SECRET="${{ secrets.APPLE_CLIENT_SECRET }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e JWT_EXPIRATION="${{ secrets.JWT_EXPIRATION }}" \
              -e JWT_REFRESH_EXPIRATION="${{ secrets.JWT_REFRESH_EXPIRATION }}" \
              $IMAGE

  post-sync:
    if: github.ref == 'refs/heads/release/prod' && github.event_name == 'push'
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to sync release/prod → dev
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Chore - release/prod → dev 싱크"
          title: "[CI] release/prod → dev 싱크"
          branch: sync/prod-to-dev
          base: dev
          body: |
            이 PR은 release/prod 브랜치에 배포된 커밋을 dev 브랜치에 반영하기 위해 자동 생성되었습니다.

      - name: Enable auto-merge (Merge commit)
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
