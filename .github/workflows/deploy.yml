name: CI/CD Deploy To EC2

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" \
            > src/main/resources/application.yml

      - name: Set up Java 17 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/zone2be-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/zone2be-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy spring app to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            
            docker stop zone2be-app || true
            docker rm   zone2be-app || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/zone2be-app:latest
            
            docker run -d \
              --name zone2be-app \
              --network zone2be_network \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/zone2be-app:latest
